<main class="auth-gate" id="authGate" aria-labelledby="authTitle">
    <section class="auth-card">
        <div class="auth-mark" aria-hidden="true">c.</div>
        <h1 class="auth-title" id="authTitle">Join Commonroom</h1>
        <p class="auth-copy">Enter the shared access token to continue.</p>
        <form class="auth-form" id="authForm">
            <label class="auth-label" for="accessToken">Access token</label>
            <input class="auth-input" id="accessToken" type="password" autocomplete="current-password" required>
            <button class="auth-submit" id="authSubmit" type="submit">Continue</button>
            <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>
